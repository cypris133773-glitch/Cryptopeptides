<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CryptoPeptides">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf5"/>
      <stop offset=".45" stop-color="#8fa0b8"/>
      <stop offset="1" stop-color="#4a5c74"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb2cc"/>
      <stop offset=".5" stop-color="#1b63f0"/>
      <stop offset="1" stop-color="#0b2f8f"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3648"/>
      <stop offset=".55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#37445a"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d9bff"/>
      <stop offset="1" stop-color="#0b3fd0"/>
    </linearGradient>
  </defs>

  <!-- hexagon frame -->
  <path d="M32 3 57 17.5v29L32 61 7 46.5v-29Z" fill="none" stroke="url(#rim)" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M32 8 52.5 20v24L32 56 11.5 44V20Z" fill="none" stroke="#0b2f8f" stroke-width="1" opacity=".35" stroke-linejoin="round"/>

  <!-- the C -->
  <path d="M34 19.5a13 13 0 1 0 0 25v-6.4a6.6 6.6 0 1 1 0-12.2Z" fill="url(#c)"/>

  <!-- molecule chain -->
  <g stroke="#7f93ad" stroke-width="2.2" stroke-linecap="round">
    <path d="M40 20.5 45 28"/>
    <path d="M45 28 39.5 35"/>
    <path d="M39.5 35 45 42.5"/>
  </g>
  <circle cx="40" cy="20" r="3.6" fill="#141c28"/>
  <circle cx="45.4" cy="28.2" r="3.2" fill="url(#node)"/>
  <circle cx="39.4" cy="35.2" r="3.4" fill="url(#node)"/>
  <circle cx="45.4" cy="43" r="3.8" fill="url(#node)"/>
</svg>
